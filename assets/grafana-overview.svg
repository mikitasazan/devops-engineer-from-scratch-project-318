<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Bulletin Board Grafana dashboard layout</title>
  <desc id="desc">Dashboard layout with CPU usage, HTTP request rate, target health, and Nginx request rate panels.</desc>
  <rect width="1200" height="650" fill="#111827"/>
  <text x="32" y="48" fill="#f9fafb" font-family="sans-serif" font-size="26" font-weight="700">Bulletin Board Overview</text>
  <g fill="#1f2937" stroke="#374151" stroke-width="2">
    <rect x="32" y="80" width="550" height="220" rx="8"/>
    <rect x="618" y="80" width="550" height="220" rx="8"/>
    <rect x="32" y="326" width="1136" height="140" rx="8"/>
    <rect x="32" y="492" width="1136" height="120" rx="8"/>
  </g>
  <g fill="#d1d5db" font-family="sans-serif" font-size="18">
    <text x="56" y="116">CPU usage</text>
    <text x="642" y="116">HTTP request rate</text>
    <text x="56" y="362">Target health</text>
    <text x="56" y="528">Nginx requests per second</text>
  </g>
