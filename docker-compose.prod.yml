services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bulletins}
      POSTGRES_USER: ${POSTGRES_USER:-bulletins}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  app:
    image: ${APP_IMAGE:-bulletin-board:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bulletins}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bulletins}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_SERVER_PORT: 9090
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    networks: [internal]

volumes:
  postgres-data:
  app-data:
  app-logs:

networks:
  internal:
