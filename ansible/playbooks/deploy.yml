---
- name: Deploy bulletin board
  hosts: app
  become: true
  vars:
    bulletin_board_image: "{{ image | default('ghcr.io/mikitasazan/devops-engineer-from-scratch-project-315:latest') }}"
    bulletin_board_container: bulletin-board
    bulletin_board_root: /opt/bulletin-board

  tasks:
    - name: Create persistent application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ bulletin_board_root }}"
        - "{{ bulletin_board_root }}/logs"
        - "{{ bulletin_board_root }}/data"
        - "{{ bulletin_board_root }}/certbot-webroot"

    - name: Pull the selected image
      community.docker.docker_image:
        name: "{{ bulletin_board_image }}"
        source: pull

    - name: Run the application container
      community.docker.docker_container:
        name: "{{ bulletin_board_container }}"
        image: "{{ bulletin_board_image }}"
        state: started
        restart_policy: unless-stopped
        recreate: false
        pull: true
        published_ports:
          - "9090:9090"
        networks:
          - name: internal
            aliases:
              - app
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: "jdbc:postgresql://localhost:5432/bulletins"
          SPRING_DATASOURCE_USERNAME: bulletins
          SPRING_DATASOURCE_PASSWORD: "{{ vault_postgres_password }}"
        volumes:
          - "{{ bulletin_board_root }}/logs:/app/logs"
          - "{{ bulletin_board_root }}/data:/app/data"

    - name: Install nginx configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../nginx.conf"
        dest: "{{ bulletin_board_root }}/nginx.conf"
        mode: "0644"
      notify: Restart nginx

    - name: Run nginx in front of the application
      community.docker.docker_container:
        name: nginx
        image: nginx:1.27-alpine
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
        networks:
          - name: internal
        volumes:
          - "{{ bulletin_board_root }}/nginx.conf:/etc/nginx/nginx.conf:ro"
          - "{{ bulletin_board_root }}/certbot-webroot:/var/www/certbot:ro"

  handlers:
    - name: Restart nginx
      community.docker.docker_container:
        name: nginx
        state: started
        restart: true
