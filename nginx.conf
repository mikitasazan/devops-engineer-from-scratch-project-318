events {}

http {
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time}';
  access_log /var/log/nginx/access.log json;
  error_log /var/log/nginx/error.log warn;
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;

  server {
    listen 80;
    server_name _;

    location /assets/ {
      proxy_cache static_cache;
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass http://app:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
      proxy_pass http://app:9090;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/prometheus {
      proxy_pass http://app:9090;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stub_status {
      stub_status;
      allow 10.0.0.0/8;
      deny all;
    }

    location / {
      proxy_pass http://app:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
