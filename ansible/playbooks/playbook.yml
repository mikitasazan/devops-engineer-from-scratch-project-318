---
- name: Prepare application server
  hosts: app
  become: true
  vars:
    docker_users:
      - "{{ ansible_user }}"
    docker_install_compose_plugin: true

  pre_tasks:
    - name: Install basic server utilities
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - ufw
        state: present
        update_cache: true

  roles:
    - geerlingguy.docker
    - node_exporter
    - nginx_exporter
    - promtail

  tasks:
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow application traffic
      community.general.ufw:
        rule: allow
        port: "80,443"
        proto: tcp

    - name: Enable firewall with a deny-by-default policy
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Restrict the management/actuator port to the monitoring host only
      # Docker publishes container ports via its own iptables rules, which run
      # ahead of ufw's chain, so ufw's deny-by-default above never sees this
      # traffic. The DOCKER-USER chain is the documented hook point Docker
      # guarantees will not be overwritten by the daemon.
      ansible.builtin.iptables:
        chain: DOCKER-USER
        protocol: tcp
        destination_port: "9090"
        source: "{{ hostvars[groups['monitoring'][0]].ansible_host }}"
        jump: RETURN
        action: insert
        rule_num: 1

    - name: Drop all other access to the management/actuator port
      ansible.builtin.iptables:
        chain: DOCKER-USER
        protocol: tcp
        destination_port: "9090"
        jump: DROP
        action: insert
        rule_num: 2
