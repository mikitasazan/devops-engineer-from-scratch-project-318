---
- name: Deploy Prometheus monitoring server
  hosts: monitoring
  become: true
  vars:
    prometheus_image: prom/prometheus:v2.55.1
    prometheus_root: /opt/prometheus

  roles:
    - geerlingguy.docker

  tasks:
    - name: Create Prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ prometheus_root }}/config"
        - "{{ prometheus_root }}/rules"
        - "{{ prometheus_root }}/data"

    - name: Install Prometheus configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../monitoring/prometheus/prometheus.yml"
        dest: "{{ prometheus_root }}/config/prometheus.yml"
        mode: "0644"
      notify: Restart Prometheus

    - name: Install Prometheus alert rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/prometheus/rules/alerts.yml"
        dest: "{{ prometheus_root }}/rules/alerts.yml"
        mode: "0644"
      notify: Restart Prometheus

    - name: Pull Prometheus image
      community.docker.docker_image:
        name: "{{ prometheus_image }}"
        source: pull

    - name: Create monitoring network
      community.docker.docker_network:
        name: monitoring
        state: present

    - name: Run Prometheus
      community.docker.docker_container:
        name: prometheus
        image: "{{ prometheus_image }}"
        state: started
        restart_policy: unless-stopped
        command:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--web.enable-lifecycle"
        published_ports:
          - "{{ prometheus_external_port }}:9090"
        networks:
          - name: monitoring
        volumes:
          - "{{ prometheus_root }}/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          - "{{ prometheus_root }}/rules:/etc/prometheus/rules:ro"
          - "{{ prometheus_root }}/data:/prometheus"

    - name: Create Loki data directory
      ansible.builtin.file:
        path: "{{ prometheus_root }}/loki"
        state: directory
        owner: 10001
        group: 10001
        mode: "0755"

    - name: Install Loki configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/loki/loki.yml"
        dest: "{{ prometheus_root }}/loki/loki.yml"
        mode: "0644"
      notify: Restart Loki

    - name: Run Loki
      community.docker.docker_container:
        name: loki
        image: grafana/loki:3.2.1
        state: started
        restart_policy: unless-stopped
        command: -config.file=/etc/loki/loki.yml
        published_ports:
          - "3100:3100"
        networks:
          - name: monitoring
        volumes:
          - "{{ prometheus_root }}/loki/loki.yml:/etc/loki/loki.yml:ro"
          - "{{ prometheus_root }}/loki:/loki"

    - name: Create Grafana directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: 472
        group: 472
        mode: "0755"
      loop:
        - "{{ prometheus_root }}/grafana"
        - "{{ prometheus_root }}/grafana/provisioning/datasources"
        - "{{ prometheus_root }}/grafana/provisioning/dashboards"
        - "{{ prometheus_root }}/grafana/provisioning/alerting"
        - "{{ prometheus_root }}/grafana/dashboards"

    - name: Install Grafana datasource provisioning
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/datasources/datasources.yml"
        dest: "{{ prometheus_root }}/grafana/provisioning/datasources/datasources.yml"
        owner: 472
        group: 472
        mode: "0644"
      notify: Restart Grafana

    - name: Install Grafana dashboard provisioning
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/dashboards/dashboards.yml"
        dest: "{{ prometheus_root }}/grafana/provisioning/dashboards/dashboards.yml"
        owner: 472
        group: 472
        mode: "0644"
      notify: Restart Grafana

    - name: Install Grafana dashboard
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/dashboards/overview.json"
        dest: "{{ prometheus_root }}/grafana/dashboards/overview.json"
        owner: 472
        group: 472
        mode: "0644"
      notify: Restart Grafana

    - name: Install Grafana contact point provisioning
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/alerting/contactpoints.yml"
        dest: "{{ prometheus_root }}/grafana/provisioning/alerting/contactpoints.yml"
        owner: 472
        group: 472
        mode: "0644"
      notify: Restart Grafana

    - name: Run Grafana
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:11.3.0
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "3000:3000"
        env:
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
          GF_USERS_ALLOW_SIGN_UP: "false"
          ALERT_WEBHOOK_URL: "{{ vault_alert_webhook_url }}"
        networks:
          - name: monitoring
        volumes:
          - "{{ prometheus_root }}/grafana:/var/lib/grafana"
          - "{{ prometheus_root }}/grafana/provisioning:/etc/grafana/provisioning:ro"
          - "{{ prometheus_root }}/grafana/dashboards:/var/lib/grafana/dashboards:ro"

  handlers:
    - name: Restart Prometheus
      community.docker.docker_container:
        name: prometheus
        state: started
        restart: true

    - name: Restart Grafana
      community.docker.docker_container:
        name: grafana
        state: started
        restart: true

    - name: Restart Loki
      community.docker.docker_container:
        name: loki
        state: started
        restart: true
