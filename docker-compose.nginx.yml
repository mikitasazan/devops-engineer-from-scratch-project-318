services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    networks: [internal]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    depends_on:
      nginx:
        condition: service_started
    command: ["-nginx.scrape-uri=http://nginx/stub_status"]
    expose:
      - "9113"
    networks: [internal]

volumes:
  nginx-cache:

networks:
  internal:
