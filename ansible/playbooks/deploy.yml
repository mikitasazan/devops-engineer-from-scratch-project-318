---
- name: Deploy bulletin board
  hosts: app
  become: true
  vars:
    bulletin_board_image: "{{ image | default('ghcr.io/mikitasazan/devops-engineer-from-scratch-project-318:latest') }}"
    bulletin_board_container: bulletin-board
    bulletin_board_root: /opt/bulletin-board
    bulletin_board_db_name: bulletins
    bulletin_board_db_user: bulletins

  tasks:
    - name: Create persistent application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ bulletin_board_root }}"
        - "{{ bulletin_board_root }}/logs"
        - "{{ bulletin_board_root }}/data"
        - "{{ bulletin_board_root }}/postgres-data"
        - "{{ bulletin_board_root }}/certbot-webroot"

    - name: Create the internal application network
      community.docker.docker_network:
        name: internal
        state: present

    - name: Run the database container
      community.docker.docker_container:
        name: bulletin-board-db
        image: postgres:16-alpine
        state: started
        restart_policy: unless-stopped
        networks:
          - name: internal
            aliases:
              - db
        env:
          POSTGRES_DB: "{{ bulletin_board_db_name }}"
          POSTGRES_USER: "{{ bulletin_board_db_user }}"
          POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
        volumes:
          - "{{ bulletin_board_root }}/postgres-data:/var/lib/postgresql/data"
        healthcheck:
          test:
            - CMD-SHELL
            - "pg_isready -U {{ bulletin_board_db_user }} -d {{ bulletin_board_db_name }}"
          interval: 5s
          timeout: 5s
          retries: 12

    - name: Wait for the database to report healthy
      community.docker.docker_container_info:
        name: bulletin-board-db
      register: bulletin_board_db_info
      until: bulletin_board_db_info.container.State.Health.Status == "healthy"
      retries: 24
      delay: 5

    - name: Pull the selected image
      community.docker.docker_image:
        name: "{{ bulletin_board_image }}"
        source: pull

    - name: Run the application container
      community.docker.docker_container:
        name: "{{ bulletin_board_container }}"
        image: "{{ bulletin_board_image }}"
        state: started
        restart_policy: unless-stopped
        recreate: false
        pull: true
        published_ports:
          - "9090:9090"
        networks:
          - name: internal
            aliases:
              - app
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/{{ bulletin_board_db_name }}"
          SPRING_DATASOURCE_USERNAME: "{{ bulletin_board_db_user }}"
          SPRING_DATASOURCE_PASSWORD: "{{ vault_postgres_password }}"
        volumes:
          - "{{ bulletin_board_root }}/logs:/app/logs"
          - "{{ bulletin_board_root }}/data:/app/data"

    - name: Install nginx configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../nginx.conf"
        dest: "{{ bulletin_board_root }}/nginx.conf"
        mode: "0644"
      notify: Restart nginx

    - name: Run nginx in front of the application
      community.docker.docker_container:
        name: nginx
        image: nginx:1.27-alpine
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
        networks:
          - name: internal
        volumes:
          - "{{ bulletin_board_root }}/nginx.conf:/etc/nginx/nginx.conf:ro"
          - "{{ bulletin_board_root }}/certbot-webroot:/var/www/certbot:ro"

  handlers:
    - name: Restart nginx
      community.docker.docker_container:
        name: nginx
        state: started
        restart: true
