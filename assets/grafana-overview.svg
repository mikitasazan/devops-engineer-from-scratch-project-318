    <path d="M642 260 C710 240 760 215 820 230 S930 170 990 205 S1080 165 1140 180"/>
  </g>
  <g stroke="#34d399" stroke-width="4" fill="none">
    <path d="M56 430 L220 430 L390 430 L550 430 L710 430 L870 430 L1030 430 L1140 430"/>
    <path d="M56 590 C200 580 320 600 460 565 S700 580 820 550 S1020 570 1140 545"/>
  </g>
</svg>
