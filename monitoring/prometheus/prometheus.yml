global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: application
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: {{ prometheus_app_targets | to_json }}

  - job_name: node_exporter
    static_configs:
      - targets: {{ prometheus_node_targets | to_json }}

  - job_name: nginx_exporter
    static_configs:
      - targets: {{ prometheus_nginx_targets | to_json }}
